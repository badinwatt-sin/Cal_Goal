<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chompy</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4F6BFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chompy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Kanit:ital,wght@0,500;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
<style>
/* Layout: single-column phone app, sticker-style cards (thick ink outline + hard shadow), bottom tab bar with a raised "+" button */
:root{
  --bg:#F4F6FF; --bgtop:#E3E9FF; --card:#FFFFFF; --soft:#EEF1FB; --tint:#E8EDFF; --ink:#141A33; --mute:#6B7391;
  --line:#E4E8F5; --shadow:rgba(60,80,200,.10);
  --lime:#4F6BFF; --lime2:#7C5CFF; --volt:#19C98B; --pink:#FF8FB1; --sky:#6FA8FF; --sun:#FFC857; --over:#FF5C6C;
  --m1:#4F6BFF; --m2:#8FA3FF; --m3:#CDD6FF; --on-accent:#FFFFFF;
  --f-display:'Kanit','Anuphan',system-ui,sans-serif;
  --f-body:'Anuphan','Kanit',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1024; --bgtop:#161C45; --card:#151B38; --soft:#1D2447; --tint:#1E2757; --ink:#EEF1FF; --mute:#98A1C8;
  --line:#263059; --shadow:rgba(0,0,0,.38); --lime:#6C84FF; --lime2:#8E6CFF; --volt:#35F0B0; --over:#FF7482; --sky:#7FB2FF; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0C1024; --bgtop:#161C45; --card:#151B38; --soft:#1D2447; --tint:#1E2757; --ink:#EEF1FF; --mute:#98A1C8;
  --line:#263059; --shadow:rgba(0,0,0,.38); --lime:#6C84FF; --lime2:#8E6CFF; --volt:#35F0B0; --over:#FF7482; --sky:#7FB2FF; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:auto}
body{background-color:var(--bg);background-image:linear-gradient(180deg,var(--bgtop),var(--bg) 340px);background-repeat:no-repeat;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
#app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-style:italic;margin:0;font-weight:700;text-wrap:balance;line-height:1.25}
h2{font-size:18px}h3{font-size:15px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}.small{font-size:13px}.tiny{font-size:12px}

.card{background:var(--card);border:2px solid var(--line);border-radius:18px;box-shadow:3px 3px 0 var(--shadow);padding:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}

.btn{font-style:italic;letter-spacing:.2px;background:var(--lime);color:var(--on-accent);border:2px solid var(--line);border-radius:14px;padding:10px 16px;font-family:var(--f-display);font-weight:600;box-shadow:2px 2px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--shadow)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.pink{background:var(--pink)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:12px}
.btn[disabled]{opacity:.5}
.icon-btn{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;flex:none}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;font-size:13px;white-space:nowrap;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);min-width:0}
input[type=text],input[type=number],input[type=email],select,textarea{width:100%;background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--ink);min-width:0}
textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.top{display:flex;align-items:center;gap:12px;padding-top:4px}
.avatar{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--sky);object-fit:cover;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--on-accent);flex:none;overflow:hidden}
.avatar.big{width:96px;height:96px;font-size:40px;box-shadow:3px 3px 0 var(--shadow)}
.date-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.date-nav .lbl{font-family:var(--f-display);font-weight:600}

.stage{position:relative;height:292px}
.stage .ring{margin:2px auto 0}
.mascot{position:absolute;right:-6px;bottom:0;width:122px;background:none;border:0;padding:0;cursor:pointer;animation:mIn .55s cubic-bezier(.3,1.5,.5,1) both;-webkit-tap-highlight-color:transparent}
.mascot svg{width:100%;height:auto;display:block;overflow:visible}
.bubble{position:absolute;left:0;bottom:6px;width:calc(100% - 132px);min-height:40px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;box-shadow:2px 2px 0 var(--shadow);padding:8px 10px;font-size:13px;line-height:1.4;font-weight:500;text-align:left}
.bubble::after{content:'';position:absolute;right:-8px;bottom:14px;width:12px;height:12px;background:inherit;border-top:2px solid var(--line);border-right:2px solid var(--line);transform:rotate(45deg)}
.bubble.act{background:var(--lime);color:var(--on-accent);cursor:pointer;font-family:var(--f-display);font-style:italic}
.bubble.act:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--shadow)}
@keyframes mIn{from{transform:translateY(34px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.m-all{animation:mBob 2.6s ease-in-out infinite}
.m-coach{animation:mJump .72s ease-in-out infinite}
.m-cheer{animation:mJump 1s ease-in-out infinite}
.m-hungry{animation:mShake .4s ease-in-out infinite alternate}
.m-stuffed{animation:mBob 3.4s ease-in-out infinite}
@keyframes mBob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.975)}}
@keyframes mJump{0%,100%{transform:translateY(0) scale(1.04,.94)}45%,55%{transform:translateY(-16px) scale(.97,1.04)}}
@keyframes mShake{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.arm{transform:rotate(var(--a,0deg))}
.arm.w{animation:mArm 1.8s ease-in-out infinite}
.m-hungry .arm.w{animation-duration:.3s}
.m-stuffed .arm.w{animation-duration:.8s}
.m-coach .arm.w{animation-duration:.72s}
.m-cheer .arm.w{animation-duration:.5s}
@keyframes mArm{0%,100%{transform:rotate(calc(var(--a) - var(--d,10deg)))}50%{transform:rotate(calc(var(--a) + var(--d,10deg)))}}
.head{transform:rotate(var(--t,0deg))}
.m-hungry .head{--t:-5deg}
.m-stuffed .head{animation:mWob 2.4s ease-in-out infinite}
@keyframes mWob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.m-stuffed .belly{animation:mJig 1.1s ease-in-out infinite}
.m-hungry .belly{animation:mRum .25s ease-in-out infinite alternate}
@keyframes mJig{0%,100%{transform:scale(1)}50%{transform:scale(1.05,1.025)}}
@keyframes mRum{from{transform:scale(1)}to{transform:scale(1.025,.97)}}
.blink{animation:mBlink 4s infinite}
@keyframes mBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.spin{animation:mSpin 1.6s linear infinite}
@keyframes mSpin{to{transform:rotate(360deg)}}
.orbit{animation:mSpin 3s linear infinite}
.tail{animation:mTail 1.6s ease-in-out infinite alternate}
@keyframes mTail{from{transform:rotate(-7deg)}to{transform:rotate(9deg)}}
.sweat{animation:mSweat 1.6s ease-in infinite}
@keyframes mSweat{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.drool{animation:mSweat 2s ease-in infinite}
.growl{animation:mGrowl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes mGrowl{from{transform:scale(.92) rotate(-4deg)}to{transform:scale(1.1) rotate(4deg)}}
.twinkle{animation:mTw 1.4s ease-in-out infinite}
@keyframes mTw{0%,100%{opacity:.2;transform:translate(0,0) scale(.6)}50%{opacity:1}}
.mascot.poke svg{animation:mPoke .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes mPoke{0%{transform:scale(1)}30%{transform:scale(.88,1.1) translateY(-10px)}100%{transform:scale(1)}}
@media (max-width:380px){.mascot{width:104px}.bubble{width:calc(100% - 114px);font-size:12.5px}}
@media (prefers-reduced-motion:reduce){.mascot,.mascot *{animation:none!important}}
.ring{position:relative;width:216px;height:216px;margin:2px auto 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-size:50px;font-weight:700;line-height:1;font-style:italic}
.eq b{font-style:italic}
.eq{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.eq>div{background:var(--soft);border-radius:12px;padding:8px;text-align:center}
.eq b{display:block;font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums}
.bar{height:14px;border:2px solid var(--line);border-radius:999px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--volt);border-right:2px solid var(--line)}
.bar>i.zero{border-right:0}
.split{display:flex;height:12px;border-radius:999px;overflow:hidden;border:2px solid var(--line)}

.meal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1.5px dashed var(--line)}
.item:first-of-type{border-top:0}
.thumb{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);object-fit:cover;flex:none;background:var(--soft);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;overflow:hidden}
.item .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{color:var(--mute);font-size:13px;padding:6px 0}
.banner{background:repeating-linear-gradient(-55deg,var(--sun) 0 14px,#FFE066 14px 28px);color:var(--on-accent);border-color:var(--line)}
.warn{background:color-mix(in srgb,var(--over) 18%,var(--card));border:2px solid var(--over);border-radius:12px;padding:8px 12px;font-size:13px}
.ok{background:color-mix(in srgb,var(--volt) 30%,var(--card));border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--line);
  padding:8px max(12px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-right,0px))}
.tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:4px 0;font-weight:500}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.tab[aria-current="page"] .dot{background:var(--lime);border:2px solid var(--line)}
.tab .dot{width:34px;height:22px;border-radius:999px;display:grid;place-items:center;border:2px solid transparent}
.tab .dot svg{width:18px;height:18px}
.fab{width:62px;height:62px;border-radius:50%;background:var(--lime);border:2px solid var(--line);box-shadow:3px 3px 0 var(--shadow);margin:-30px auto 0;display:grid;place-items:center;color:var(--on-accent);padding:0}
.fab svg{width:30px;height:30px}
.fab:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--shadow)}

#sheetWrap{position:fixed;inset:0;z-index:40;display:none;background:rgba(10,10,20,.55);align-items:flex-end;justify-content:center}
#sheetWrap.open{display:flex}
#sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border:2px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;
  padding:14px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:8px 6px;font-weight:600;font-family:var(--f-display);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.food{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:9px 12px}
.food:active{background:var(--soft)}
.results{display:flex;flex-direction:column;gap:8px}
.qty{display:flex;align-items:center;gap:8px}
.qty input{width:80px;text-align:center}
.photo{width:100%;aspect-ratio:4/3;max-height:210px;border:2px dashed var(--line);border-radius:16px;background:var(--soft);display:grid;place-items:center;overflow:hidden;color:var(--mute);text-align:center;padding:10px}
.photo img{width:100%;height:100%;object-fit:cover}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--lime);animation:sp .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.fig{margin:0;background:var(--soft);border:2px solid var(--line);border-radius:16px;padding:6px 4px 8px;text-align:center;min-width:0}
.fig svg{width:100%;height:auto;display:block}
.fig figcaption{font-size:12px;line-height:1.35}
.pop svg{animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.act-grid button{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 6px;font-size:13px;font-weight:500;line-height:1.3}
.act-grid button[aria-pressed="true"]{background:var(--lime);color:var(--on-accent);box-shadow:2px 2px 0 var(--shadow)}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
details summary{cursor:pointer;font-family:var(--f-display);font-weight:600}
details ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--mute)}
details li{margin-bottom:4px}
svg text{font-family:var(--f-body);fill:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}

.hero{color:#fff;background:repeating-linear-gradient(-55deg,rgba(255,255,255,.055) 0 14px,transparent 14px 28px),linear-gradient(145deg,#0F1A55 0%,#2340E0 100%);box-shadow:4px 4px 0 var(--lime)}
.hero .mute{color:rgba(255,255,255,.74)}
.hero .lbl{color:#fff}
.hero .icon-btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.55)}
.hero .eq>div{background:rgba(255,255,255,.13)}
.ring-ic{display:flex;gap:10px;margin-top:8px}
.ric{width:44px;height:44px;border-radius:50%;border:2px solid #0B1230;background:var(--volt);color:#0B1230;display:grid;place-items:center;padding:0;box-shadow:2px 2px 0 #0B1230;transition:transform .08s,box-shadow .08s}
.ric.cam{background:var(--lime)}
.ric svg{width:22px;height:22px}
.ric:active{transform:translate(2px,2px);box-shadow:none}
.mi{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:inline-grid;place-items:center;margin-right:8px;font-size:16px;vertical-align:middle}
.mi-b{background:var(--sun)}.mi-l{background:var(--lime)}.mi-d{background:var(--sky)}.mi-s{background:var(--pink)}
.qchip b{font-family:var(--f-display);font-style:italic;color:var(--lime);margin-left:4px}
.streak{background:var(--sun);color:var(--on-accent);flex:none;font-family:var(--f-display);font-style:italic;font-weight:700}
.tabbar{background:#0B1230;border-top:2px solid #0B1230}
.tab{color:rgba(255,255,255,.62)}
.tab[aria-current="page"]{color:#fff}
.tab[aria-current="page"] .dot{background:var(--lime);border-color:#0B1230;color:#0B1230}
.fab{background:var(--volt);border-color:#0B1230;box-shadow:0 0 0 5px #0B1230,3px 3px 0 5px #0B1230}
.fab:active{box-shadow:0 0 0 5px #0B1230}
.fig{background:linear-gradient(160deg,color-mix(in srgb,var(--sky) 38%,var(--card)),color-mix(in srgb,var(--pink) 30%,var(--card)));position:relative;overflow:hidden}
.fig::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 18% 22%,#fff9 0 3px,transparent 4px),radial-gradient(circle at 82% 30%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 70% 14%,#fff8 0 4px,transparent 5px),radial-gradient(circle at 12% 62%,#fff7 0 2px,transparent 3px);pointer-events:none}
.fig>*{position:relative}
.cinp{width:34px;height:30px;padding:0;border:2px solid var(--line);border-radius:50%;background:none;overflow:hidden;flex:none}
input[type=range]{width:100%;accent-color:var(--lime);padding:0;background:none;border:0}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--lime);color:var(--on-accent);border:2px solid var(--line);border-radius:18px;padding:14px;box-shadow:3px 3px 0 var(--shadow);font-size:17px}
.choice.alt{background:var(--volt)}
.choice .ci{font-size:30px;line-height:1}
.choice b{display:block;font-family:var(--f-display);font-style:italic;font-weight:700}
.choice small{display:block;font-size:12.5px;font-weight:500;opacity:.85;line-height:1.35}
.choice:active{transform:translate(2px,2px);box-shadow:none}
.lid{transform-box:fill-box;transform-origin:50% 0%;transform:scaleY(0)}
.m-sleep .lid{transform:scaleY(1)}
.m-sleep.m-all{animation:mBob 4.5s ease-in-out infinite}
.m-sleep .head{--t:7deg}
.pupw{transform:translate(var(--px,0px),var(--py,0px));transition:transform .12s ease-out}
.it,.hearts,.notes,.heyes,.yawnm{opacity:0}
.zzz{opacity:0}.m-sleep .zzz{opacity:1}
.zzz text{animation:mZ 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes mZ{0%{transform:translate(0,6px) scale(.6);opacity:0}30%{opacity:1}100%{transform:translate(8px,-16px) scale(1.1);opacity:0}}
.zzz text:nth-child(2){animation-delay:.8s}.zzz text:nth-child(3){animation-delay:1.6s}
.x-jump .m-act{animation:mJump .7s ease-in-out 2}
.x-spin .m-act{animation:mTurn 1.2s ease-in-out 1}
@keyframes mTurn{0%{transform:scaleX(1) translateY(0)}25%{transform:scaleX(0) translateY(-8px)}50%{transform:scaleX(-1) translateY(-10px)}75%{transform:scaleX(0) translateY(-8px)}100%{transform:scaleX(1) translateY(0)}}
.x-dance .m-act{animation:mDance .6s ease-in-out infinite alternate}
@keyframes mDance{from{transform:rotate(-4deg) translateY(0)}to{transform:rotate(4deg) translateY(-6px)}}
.x-dance .AL{--a:135deg!important;--d:28deg!important;animation-duration:.6s}
.x-dance .AR{--a:-135deg!important;--d:28deg!important;animation-duration:.6s}

/* ---------- calculations ---------- */
const bmr=p=>10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
const tdee=p=>bmr(p)*p.act;
const bmi=p=>p.weight/Math.pow(p.height/100,2);
function bmiLabel(b){return b<18.5?'น้ำหนักน้อย':b<23?'สมส่วน':b<25?'น้ำหนักเกิน':b<30?'อ้วน':'อ้วนมาก'}
const PD={week:7,month:30,year:365};
const PL={week:'สัปดาห์',month:'เดือน',year:'ปี'};
function goalCalc(){
  const p=S.profile,g=S.goal,T=tdee(p),diff=p.weight-g.target;
  const floor=p.sex==='m'?1500:1200;
  const base={tdee:T,floor:floor,diff:diff};
  if(diff<=0){return{...base,mode:'maintain',budget:Math.round(T),deficit:0,kgDay:0,wk:0,eta:null,days:null,clamped:false,fast:false}}
  const reqKgDay=g.amount/PD[g.period];
  let deficit=reqKgDay*7700,budget=T-deficit,clamped=false;
  if(budget<floor){budget=floor;deficit=T-floor;clamped=true}
  const kgDay=Math.max(0,deficit/7700);
  const days=kgDay>0?Math.ceil(diff/kgDay):null;
  const eta=days?addDays(todayKey(),days):null;
  const wk=reqKgDay*7;
  return{...base,mode:'lose',budget:Math.round(budget),deficit:deficit,kgDay:kgDay,wk:kgDay*7,eta:eta,days:days,clamped:clamped,fast:wk>Math.max(0.01*p.weight,0.25)&&wk>0.01*p.weight}
}
const stepKm=steps=>steps*(S.profile.height*0.415)/100000;
const stepKcal=steps=>Math.round(stepKm(steps)*0.5*S.profile.weight);
const actKcal=(met,min)=>Math.round(Math.max(met-1,0)*S.profile.weight*min/60);
function getLog(k){return S.logs[k]||{meals:[],workouts:[],steps:0}}
function ensureLog(k){if(!S.logs[k])S.logs[k]={meals:[],workouts:[],steps:0};return S.logs[k]}
function totals(k){
  const L=getLog(k),G=goalCalc();
  let e=0,p=0,c=0,f=0;L.meals.forEach(m=>{e+=m.kcal;p+=m.p;c+=m.c;f+=m.f});
  const bw=L.workouts.reduce((a,w)=>a+w.kcal,0),bs=stepKcal(L.steps||0);
  const budget=G.budget+bw+bs;
  return{eaten:e,p:p,c:c,f:f,bw:bw,bs:bs,base:G.budget,budget:budget,left:budget-e,steps:L.steps||0}
}

function ringSVG(eaten,budget){
  const R=88,C=2*Math.PI*R,pr=budget>0?Math.min(eaten/budget,1):0,over=eaten>budget;
  return `<svg viewBox="0 0 216 216" aria-hidden="true"><circle cx="108" cy="108" r="${R}" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="22"/>
  <circle cx="108" cy="108" r="${R}" fill="none" stroke="${over?'#FF5C7C':'var(--volt)'}" stroke-width="22" stroke-linecap="round" stroke-dasharray="${(C*pr).toFixed(1)} ${C.toFixed(1)}"/></svg>`}

function weekChart(){
  const keys=[];for(let i=6;i>=0;i--)keys.push(addDays(ui.date,-i));
  const data=keys.map(k=>totals(k));
  const mx=Math.max(...data.map(d=>Math.max(d.eaten,d.budget)),500)*1.15;
  const W=320,H=130,top=14,bot=22,ch=H-top-bot,bw=26,gap=(W-7*bw)/8;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="แคลอรี่ที่กิน 7 วันล่าสุดเทียบกับงบของแต่ละวัน">`;
  keys.forEach((k,i)=>{
    const d=data[i],x=gap+i*(bw+gap),h=d.eaten/mx*ch,y=top+ch-h,by=top+ch-d.budget/mx*ch;
    const col=d.eaten>d.budget?'var(--over)':'var(--volt)';
    s+=`<rect x="${x}" y="${top}" width="${bw}" height="${ch}" rx="7" fill="var(--soft)"/>`;
    if(d.eaten>0)s+=`<rect x="${x}" y="${y.toFixed(1)}" width="${bw}" height="${Math.max(h,4).toFixed(1)}" rx="7" fill="${col}" stroke="var(--line)" stroke-width="1.5"/>`;
    s+=`<line x1="${x-3}" x2="${x+bw+3}" y1="${by.toFixed(1)}" y2="${by.toFixed(1)}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 2"/>`;
    if(d.eaten>0)s+=`<text x="${x+bw/2}" y="${Math.max(y-3,10).toFixed(1)}" font-size="9" text-anchor="middle">${fmt(d.eaten)}</text>`;
    s+=`<text x="${x+bw/2}" y="${H-6}" font-size="11" text-anchor="middle" ${k===ui.date?'style="fill:var(--ink);font-weight:600"':''}>${WD[fromKey(k).getDay()]}</text>`;
  });
  return s+'</svg>';
}

function viewToday(){
  const k=ui.date,t=totals(k),L=getLog(k),isToday=k===todayKey(),p=S.profile,G=goalCalc();
  const over=t.left<0;
  const lbl=isToday?'วันนี้':fromKey(k).toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'short'});
  const kcalPer=t.p*4+t.c*4+t.f*9||1;
  const pc=Math.round(t.p*4/kcalPer*100),cc=Math.round(t.c*4/kcalPer*100),fc=Math.max(0,100-pc-cc);
  let h=`<div class="top">${avatarHTML()}<div class="grow"><h1 style="font-size:20px">สวัสดี ${esc(p.name||'เพื่อน')} 👋</h1><p class="small mute">${isToday?'วันนี้กินอะไรดี':'ย้อนดูบันทึก'}</p></div>${streak()?`<span class="chip streak">🔥 ${streak()} วันติด</span>`:''}</div>`;
  if(!p.set)h+=`<div class="card banner"><b>ตั้งค่าโปรไฟล์ก่อนนะ</b><p class="small" style="margin:4px 0 10px">ตอนนี้ใช้ค่าตัวอย่าง (หญิง 25 ปี 165 ซม. 60 กก.) กรอกข้อมูลจริงเพื่อให้ TDEE ตรงกับตัวคุณ</p><button class="btn sm alt" data-act="tab" data-v="me">ไปกรอกโปรไฟล์</button></div>`;
  h+=`<div class="card hero"><div class="date-nav"><button class="icon-btn" data-act="day" data-v="-1" aria-label="วันก่อนหน้า">${IC.left}</button><span class="lbl">${esc(lbl)}</span><button class="icon-btn" data-act="day" data-v="1" aria-label="วันถัดไป" ${isToday?'disabled style="opacity:.35"':''}>${IC.right}</button></div>
  <div class="stage"><div class="ring">${ringSVG(t.eaten,t.budget)}<div class="mid"><span class="small mute">${over?'กินเกินมา':'เหลืออีก'}</span><span class="num big" style="color:${over?'#FF7A94':'#fff'}">${fmt(Math.abs(t.left))}</span><span class="small mute">kcal</span></div></div>${mascotBlock(k,t)}</div>
  <div class="eq"><div><span class="tiny mute">กินแล้ว</span><b>${fmt(t.eaten)}</b></div><div><span class="tiny mute">งบกินวันนี้</span><b>${fmt(t.budget)}</b></div><div><span class="tiny mute">เผาจากออกกำลัง</span><b>+${fmt(t.bw+t.bs)}</b></div></div>
  <p class="tiny mute" style="margin-top:8px;text-align:center">งบ = เป้าประจำวัน ${fmt(t.base)} + ออกกำลังกาย ${fmt(t.bw)} + ก้าวเดิน ${fmt(t.bs)} · TDEE ของคุณ ${fmt(G.tdee)}</p></div>`;
  h+=`<div class="card stack"><div class="row between"><h2>💪 สารอาหารวันนี้</h2><span class="small mute">ประมาณการ</span></div>
   <div class="grid3 num" style="text-align:center"><div><b style="font-size:20px">${Math.round(t.p)}</b><div class="tiny mute">โปรตีน (ก.)</div></div><div><b style="font-size:20px">${Math.round(t.c)}</b><div class="tiny mute">คาร์บ (ก.)</div></div><div><b style="font-size:20px">${Math.round(t.f)}</b><div class="tiny mute">ไขมัน (ก.)</div></div></div>
   <div class="split" role="img" aria-label="สัดส่วนพลังงาน โปรตีน ${pc}% คาร์บ ${cc}% ไขมัน ${fc}%">${t.eaten>0?`<i style="width:${pc}%;background:var(--sky)"></i><i style="width:${cc}%;background:var(--sun)"></i><i style="width:${fc}%;background:var(--pink)"></i>`:''}</div>
   <div class="row tiny mute wrap" style="gap:14px"><span><b style="color:var(--sky)">■</b> โปรตีน ${t.eaten>0?pc:0}%</span><span><b style="color:var(--sun)">■</b> คาร์บ ${t.eaten>0?cc:0}%</span><span><b style="color:var(--pink)">■</b> ไขมัน ${t.eaten>0?fc:0}%</span></div></div>`;
  const sp=Math.min(t.steps/S.goal.stepGoal,1);
  h+=`<div class="card stack"><div class="row between"><h2>👟 ก้าวเดิน</h2><button class="btn sm alt" data-act="tab" data-v="work">อัปเดต</button></div>
   <div class="bar" role="progressbar" aria-valuenow="${t.steps}" aria-valuemax="${S.goal.stepGoal}"><i class="${sp===0?'zero':''}" style="width:${sp*100}%"></i></div>
   <div class="row between small"><span class="num"><b>${fmt(t.steps)}</b> / ${fmt(S.goal.stepGoal)} ก้าว</span><span class="mute">${r1(stepKm(t.steps))} กม. · ${fmt(t.bs)} kcal</span></div></div>`;
  MEALS.forEach(m=>{
    const items=L.meals.filter(x=>x.meal===m[0]),sum=items.reduce((a,x)=>a+x.kcal,0);
    h+=`<div class="card"><div class="meal-h"><div><h3><span class="mi mi-${m[0]}">${m[2]}</span>${m[1]}</h3><span class="small mute num">${fmt(sum)} kcal</span></div><button class="btn sm" data-act="add" data-meal="${m[0]}">+ เพิ่ม</button></div>`;
    if(!items.length)h+=`<p class="empty">ยังไม่มีรายการ แตะ “เพิ่ม” เพื่อบันทึก</p>`;
    items.forEach(x=>{h+=`<div class="item">${x.img?`<img class="thumb" src="${x.img}" alt="">`:`<div class="thumb" style="background:var(--soft);font-size:24px">${foodEmoji(x.name)}</div>`}
      <div class="grow"><div class="nm">${esc(x.name)}</div><div class="tiny mute">${x.qty!==1?x.qty+' × ':''}${esc(x.serving||'')} · P${Math.round(x.p)} C${Math.round(x.c)} F${Math.round(x.f)}</div></div>
      <span class="kc">${fmt(x.kcal)}</span><button class="icon-btn" data-act="delMeal" data-id="${x.id}" aria-label="ลบ ${esc(x.name)}">${IC.x}</button></div>`});
    h+='</div>'});
  if(L.workouts.length){h+=`<div class="card"><h3>🔥 ออกกำลังกายวันนี้</h3>`;L.workouts.forEach(w=>{h+=`<div class="item"><div class="grow"><div class="nm">${w.ic||'🔥'} ${esc(w.name)}</div><div class="tiny mute">${w.min} นาที</div></div><span class="kc" style="color:var(--mute)">−${fmt(w.kcal)}</span></div>`});h+='</div>'}
  h+=`<div class="card"><h2 style="margin-bottom:6px">📈 7 วันล่าสุด</h2>${weekChart()}<p class="tiny mute">แท่ง = แคลที่กิน · เส้นประ = งบของวันนั้น</p></div>`;
  return h;
}

  <div class="card stack"><div class="row between"><h2>👟 ก้าวเดิน${k===todayKey()?'วันนี้':''}</h2><span class="small mute">เป้า ${fmt(S.goal.stepGoal)}</span></div>

  <div class="card stack"><h2>🔥 เพิ่มการออกกำลังกาย</h2><div class="act-grid">${ACTS.map((a,i)=>`<button data-act="pickAct" data-i="${i}" aria-pressed="${w.i===i}">${a[2]}<br>${esc(a[0])}</button>`).join('')}</div>
   <div class="grid2"><label class="f">ระยะเวลา (นาที)<input type="number" id="wMin" inputmode="numeric" min="1" value="${w.min}"></label>

   <button class="btn" data-act="addWork">เพิ่ม ${ACTS[w.i][2]} ${esc(ACTS[w.i][0])}</button></div>`;

function goalBox(){
  const G=goalCalc(),p=S.profile,g=S.goal;
  let h='';
  if(G.mode==='maintain'){
    h+=`<div class="ok">น้ำหนักเป้าหมายไม่สูงกว่าน้ำหนักปัจจุบัน ตอนนี้แอปคำนวณเป็นโหมดรักษาน้ำหนัก กินได้ ${fmt(G.budget)} kcal ต่อวัน</div>`;
  }else{
    const kg=G.kgDay;
    h+=`<div class="grid3 num" style="text-align:center"><div class="eq" style="display:block;margin:0"><div style="background:none;padding:0"><b>${r1(kg*7)}</b><span class="tiny mute">กก./สัปดาห์</span></div></div><div class="eq" style="display:block;margin:0"><div style="background:none;padding:0"><b>${r1(kg*30)}</b><span class="tiny mute">กก./เดือน</span></div></div><div class="eq" style="display:block;margin:0"><div style="background:none;padding:0"><b>${r1(kg*365)}</b><span class="tiny mute">กก./ปี</span></div></div></div>
    <div class="eq" style="grid-template-columns:1fr 1fr"><div><span class="tiny mute">ต้องลดจากที่กิน/วัน</span><b>${fmt(G.deficit)} kcal</b></div><div><span class="tiny mute">กินได้ไม่เกิน/วัน</span><b style="background:var(--lime);color:var(--on-accent);border-radius:8px">${fmt(G.budget)} kcal</b></div></div>
    <p class="small">ถึงน้ำหนัก ${g.target} กก. ประมาณ <b>${G.eta?fromKey(G.eta).toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'}):'-'}</b> (อีก ${G.days?G.days.toLocaleString('en-US'):'-'} วัน)</p>`;
    if(G.clamped)h+=`<div class="warn">เป้าที่ตั้งไว้ทำให้ต้องกินต่ำกว่า ${fmt(G.floor)} kcal/วัน แอปเลยปรับให้ไม่ต่ำกว่าขั้นต่ำเพื่อความปลอดภัย ลองเพิ่มระยะเวลาหรือลดจำนวนกิโลต่อรอบ</div>`;
    else if(G.fast)h+=`<div class="warn">ลดเกิน 1% ของน้ำหนักตัวต่อสัปดาห์ (~${r1(0.01*p.weight)} กก.) ถือว่าเร็วเกินไป แนะนำ 0.25–1 กก./สัปดาห์ จะยั่งยืนกว่า</div>`;
    else h+=`<div class="ok">อัตรานี้อยู่ในช่วงที่แนะนำ (ไม่เกิน ~1% ของน้ำหนักตัวต่อสัปดาห์)</div>`;
  }
  return h;
}

function weightChart(){
  const ws=[...S.weights].sort((a,b)=>a.d<b.d?-1:1).slice(-30);
  if(ws.length<2)return '<p class="empty">บันทึกน้ำหนักอย่างน้อย 2 ครั้งเพื่อดูกราฟ</p>';
  const W=320,H=150,l=30,r=10,t=12,b=22,vals=ws.map(x=>x.w).concat([S.goal.target]);
  const mn=Math.floor(Math.min(...vals)-1),mx=Math.ceil(Math.max(...vals)+1);
  const X=i=>l+(W-l-r)*i/(ws.length-1),Y=v=>t+(H-t-b)*(1-(v-mn)/(mx-mn));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="กราฟน้ำหนัก">`;
  [mn,(mn+mx)/2,mx].forEach(v=>{s+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--soft)" stroke-width="1.5"/><text x="${l-4}" y="${Y(v)+3}" font-size="10" text-anchor="end">${r1(v)}</text>`});
  s+=`<line x1="${l}" x2="${W-r}" y1="${Y(S.goal.target)}" y2="${Y(S.goal.target)}" stroke="var(--over)" stroke-width="2" stroke-dasharray="5 3"/><text x="${W-r}" y="${Y(S.goal.target)-4}" font-size="10" text-anchor="end" style="fill:var(--over)">เป้า ${S.goal.target}</text>`;
  s+=`<polyline fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" points="${ws.map((x,i)=>X(i).toFixed(1)+','+Y(x.w).toFixed(1)).join(' ')}"/>`;
  ws.forEach((x,i)=>{s+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(x.w).toFixed(1)}" r="${i===ws.length-1?5:3}" fill="${i===ws.length-1?'var(--lime)':'var(--card)'}" stroke="var(--ink)" stroke-width="2"/>`});
  const f=fromKey(ws[0].d),la=fromKey(ws[ws.length-1].d);
  s+=`<text x="${l}" y="${H-5}" font-size="10">${f.getDate()}/${f.getMonth()+1}</text><text x="${W-r}" y="${H-5}" font-size="10" text-anchor="end">${la.getDate()}/${la.getMonth()+1}</text></svg>`;
  return s;
}

function viewGoal(){
  const g=S.goal,p=S.profile;
  const sug=g.target<p.weight?'10,000':'8,000';
  return `<div class="top"><h1 style="font-size:22px">🏆 เป้าหมาย</h1></div>
  <div class="card stack"><h2>🎯 เป้าหมายน้ำหนัก</h2>
   <div class="grid2"><label class="f">น้ำหนักตอนนี้ (กก.)<input type="number" step="0.1" inputmode="decimal" data-bind="profile.weight" data-num value="${p.weight}"></label>
   <label class="f">น้ำหนักที่อยากได้ (กก.)<input type="number" step="0.1" inputmode="decimal" data-bind="goal.target" data-num value="${g.target}"></label></div>
   <div><div class="small mute" style="margin-bottom:6px">ตั้งความเร็วเป็นรอบ</div><div class="seg">${['week','month','year'].map(x=>`<button data-act="period" data-v="${x}" aria-pressed="${g.period===x}">รายสัปดาห์${''}</button>`.replace('รายสัปดาห์','ราย'+PL[x])).join('')}</div></div>
   <label class="f">อยากลดกี่กิโลต่อ${PL[g.period]}<input type="number" step="0.1" min="0" inputmode="decimal" data-bind="goal.amount" data-num value="${g.amount}"></label>
   <div id="goalBox" class="stack">${goalBox()}</div></div>
  <div class="card stack"><h2>🏅 เป้าหมายก้าวเดิน</h2>
   <label class="f">ก้าวต่อวัน<input type="number" step="500" min="1000" inputmode="numeric" data-bind="goal.stepGoal" data-num value="${g.stepGoal}"></label>
   <p class="small mute">ค่าแนะนำสำหรับคุณ ~${sug} ก้าว/วัน งานวิจัยพบว่าความเสี่ยงเสียชีวิตก่อนวัยลดลงชัดเจนที่ราว 7,000–10,000 ก้าว/วัน</p></div>
  <div class="card stack"><div class="row between"><h2>⚖️ น้ำหนักของฉัน</h2></div>
   <div class="row"><input type="number" id="wtIn" step="0.1" inputmode="decimal" placeholder="น้ำหนักวันนี้ (กก.)" aria-label="น้ำหนักวันนี้"><button class="btn" data-act="logWeight">บันทึก</button></div>
   ${weightChart()}</div>
  <div class="card"><details><summary>ข้อมูลอ้างอิงที่ใช้คำนวณ</summary><ul>
   <li>BMR: สมการ Mifflin–St Jeor (1990) จาก เพศ อายุ ส่วนสูง น้ำหนัก</li>
   <li>TDEE = BMR × ตัวคูณกิจกรรม 1.2 / 1.375 / 1.55 / 1.725 (ใช้ระดับกิจกรรมนอกเหนือจากการออกกำลังกายที่บันทึกในแอป)</li>
   <li>ไขมัน 1 กก. ≈ 7,700 kcal เป็นค่าประมาณที่ใช้กันทั่วไป (Wishnofsky 1958) ตัวเลขจริงแตกต่างกันตามบุคคล</li>
   <li>อัตราลดน้ำหนักที่แนะนำ 0.25–1 กก./สัปดาห์ (ไม่เกิน ~1% ของน้ำหนักตัว) และไม่ต่ำกว่า 1,200 kcal (หญิง) / 1,500 kcal (ชาย) ต่อวันหากไม่มีแพทย์ดูแล</li>
   <li>พลังงานจากออกกำลังกาย: (MET − 1) × น้ำหนัก × ชั่วโมง ใช้ค่า MET จาก Compendium of Physical Activities (Ainsworth et al.)</li>

}

const QUIPS={sleep:['zzz...','อีก 5 นาทีนะ...'],hungry:['โครก~ 🥺','ขอข้าวหน่อยยย','หิวจนมองอะไรก็เป็นข้าวผัด'],stuffed:['อึ๊ก... อย่าจิ้มพุง 😵','แน่นไปหมดแล้ว','ขอนอนพักแป๊บ'],coach:['ลุกขึ้น! ไปเดินกัน 💪','อีกแค่ 20 นาทีเอง!','เดี๋ยวไปด้วยกัน'],cheer:['เยี่ยมไปเลย! 🔥','สุดยอด!','ภูมิใจในตัวเธอ'],happy:['หวัดดี~ 👋','วันนี้กินอะไรดี','จั๊กจี้นะ!']};
function mascotInfo(k,t){

let idleT=null,actT=null,lastAct='';

function playAct(name){
  const g=$('.m-all'),mc=$('.mascot');if(!g||!mc)return;
  const st=mc.dataset.st,ok=ACT_BY[st]||[];
  if(!ok.length)return;
  if(!ok.includes(name))name=ok[0];
  ACT_N.forEach(n=>g.classList.remove('x-'+n));
  void g.getBoundingClientRect();
  g.classList.add('x-'+name);lastAct=name;
  clearTimeout(actT);actT=setTimeout(()=>g.classList.remove('x-'+name),ACTD[name]||2500);
}
function startIdle(first){
  idleT=setTimeout(()=>{
    if(!document.hidden&&ui.tab==='today'&&!ui.sh){
      const mc=$('.mascot'),list=mc?(ACT_BY[mc.dataset.st]||[]).filter(n=>n!==lastAct):[];
      if(list.length)playAct(list[Math.floor(Math.random()*list.length)]);
    }
    startIdle();
  },first||(4200+Math.random()*4200));
}
function avLife(){

document.addEventListener('pointermove',e=>{
  const m=$('.mascot svg');if(!m)return;
  const r=m.getBoundingClientRect(),cl=v=>Math.max(-1,Math.min(1,v));
  const dx=(e.clientX-(r.left+r.width/2))/(window.innerWidth*0.5),dy=(e.clientY-(r.top+r.height*0.35))/(window.innerHeight*0.5);
  m.style.setProperty('--px',(cl(dx)*2.6).toFixed(2)+'px');m.style.setProperty('--py',(cl(dy)*2.6).toFixed(2)+'px');
});

function obCheck(st){
  const p=S.profile,g=S.goal,o=ui.ob;
  if(st===1){
    if(!(p.age>=10&&p.age<=100)){toast('อายุต้องอยู่ระหว่าง 10–100 ปี');return false}
    if(!(p.height>=100&&p.height<=230)){toast('ส่วนสูงต้องอยู่ระหว่าง 100–230 ซม.');return false}
    if(!(p.weight>=25&&p.weight<=300)){toast('น้ำหนักต้องอยู่ระหว่าง 25–300 กก.');return false}
  }
  if(st===3){
    if(p.age<18)o.mode='keep';
    if(o.mode==='lose'){
      if(!(g.target<p.weight)){toast('น้ำหนักเป้าหมายต้องน้อยกว่าน้ำหนักปัจจุบัน');return false}
      if(g.target<minTarget()){toast('น้ำหนักเป้าหมายต่ำเกินไป ต่ำสุด '+minTarget()+' กก. (BMI 18.5)');return false}
      if(!(g.amount>0)){toast('ใส่จำนวนกิโลที่อยากลดต่อรอบ');return false}
    }else g.target=p.weight;
    if(!(g.stepGoal>=1000)){toast('เป้าก้าวเดินอย่างน้อย 1,000 ก้าว');return false}
  }
  return true;
}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function cloudCopy(){
  const c=JSON.parse(JSON.stringify(S));
  Object.keys(c.logs||{}).forEach(k=>{(c.logs[k].meals||[]).forEach(m=>{delete m.img})});
  return c;

let pushT=null;
function queueCloud(){if(!SB||!USER)return;ui.sync='pending';setSyncLbl();clearTimeout(pushT);pushT=setTimeout(pushCloud,1500)}
async function pushCloud(){
  if(!SB||!USER||!S.onboarded)return;
  clearTimeout(pushT);
  try{
    const {error}=await SB.from('user_data').upsert({user_id:USER.id,data:cloudCopy(),updated_at:new Date().toISOString()});
    if(error)throw error;
    ui.sync='ok';ui.syncAt=Date.now();
  }catch(e){ui.sync='error'}
  setSyncLbl();
}
async function pullCloud(){
  try{
    const {data,error}=await SB.from('user_data').select('data,updated_at').eq('user_id',USER.id).maybeSingle();
    if(error)throw error;
    if(data&&data.data){
      const c=data.data;
      if((c.rev||0)>(S.rev||0)||(!S.onboarded&&c.onboarded)){
        const d=defaults();
        S={...d,...c,profile:{...d.profile,...c.profile},goal:{...d.goal,...c.goal}};
        saveLocal();ui.tab='today';ui.ob=null;ui.body=null;toast('ซิงก์ข้อมูลจากบัญชีแล้ว');
      }else if((S.rev||0)>(c.rev||0)&&S.onboarded){await pushCloud()}
    }else if(S.onboarded){await pushCloud()}
    ui.sync='ok';ui.syncAt=Date.now();
  }catch(e){ui.sync='error'}
}
async function afterLogin(){await pullCloud();render()}

    SB=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const r=await SB.auth.getSession();
    USER=(r.data&&r.data.session&&r.data.session.user)||null;

      if(ev==='SIGNED_IN'&&sess&&sess.user&&(!USER||USER.id!==sess.user.id)){USER=sess.user;GUEST=false;setTimeout(afterLogin,0)}

async function beepSend(text){
  const c=ui.chat;text=(text||'').trim();
  if(!text||!c||c.busy)return;
  c.msgs.push({role:'user',text:text.slice(0,300)});c.busy=true;
  const inChat=()=>ui.sh&&ui.sh.mode==='chat';
  if(inChat()){renderChatSheet();scrollChat()}
  try{
    const ctx=beepContext();let reply='';
    if(SAMPLE){
      const turns=c.msgs.slice(-12).map((m,i)=>({role:m.role==='user'?'user':'assistant',content:(i===0?BEEP_SYS+'\nข้อมูลผู้ใช้ (JSON): '+JSON.stringify(ctx)+'\n\nข้อความของผู้ใช้: ':'')+m.text}));
      while(turns.length&&turns[0].role!=='user')turns.shift();
      const r=await SAMPLE(turns,{cache:false});reply=r.text;
    }else{
      const ac=new AbortController(),to=setTimeout(()=>ac.abort(),30000);
      try{
        const resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},signal:ac.signal,body:JSON.stringify({messages:c.msgs.slice(-8),context:ctx})});
        let j={};try{j=await resp.json()}catch(x){}
        if(!resp.ok){const er=new Error('api');er.code=j.error||('http_'+resp.status);throw er}
        reply=j.reply||'';
      }finally{clearTimeout(to)}
    }
    c.msgs.push({role:'assistant',text:reply||'Beep คิดไม่ออกเลย ลองถามใหม่อีกครั้งนะ'});
  }catch(e){
    const code=e&&e.code;
    c.msgs.push({role:'assistant',text:({daily_limit:'วันนี้ถามครบโควตาแล้ว พรุ่งนี้มาคุยกันใหม่นะ 🙏',quota:'ตอนนี้คนใช้เยอะ ลองใหม่อีกสักครู่นะ',not_configured:'Beep ยังไม่เปิดใช้งาน 🛠️'})[code]||('Beep ตอบไม่ได้ตอนนี้ ลองใหม่อีกครั้งนะ (รหัส: '+(code||'network')+')')});
  }
  c.msgs=c.msgs.slice(-20);c.busy=false;
  if(inChat()){renderChatSheet();scrollChat();const i=$('#chatIn');if(i)i.focus()}
}

/* ---------- AI estimate ---------- */
async function shrink(file,max,q){
  const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const s=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
  return{blob:blob,url:c.toDataURL('image/jpeg',q)};
}
async function onPhoto(file){
  if(!file||!ui.sh)return;
  try{
    const big=await shrink(file,USE_API?768:1024,USE_API?0.75:0.82),small=await shrink(file,260,0.7);
    ui.sh.tab='ai';ui.sh.ai.blob=big.blob;ui.sh.ai.img=small.url;ui.sh.ai.items=null;ui.sh.ai.err='';
    renderSheet();if(SAMPLE||USE_API)runAI();
  }catch(e){toast('เปิดรูปนี้ไม่ได้ ลองรูปอื่นนะ')}
}
async function runAI(){
  const a=ui.sh.ai;
  if(!a.blob&&!a.text.trim()){a.err='ใส่รูปหรือพิมพ์รายละเอียดอาหารก่อนนะ';renderSheet();return}
  a.loading=true;a.err='';renderSheet();
  const prompt=`คุณเป็นนักกำหนดอาหารที่ช่วยประเมินแคลอรี่อาหารไทยและอาหารนานาชาติสำหรับคนไทย
ดูรูป (ถ้ามี) และคำอธิบายของผู้ใช้ แล้วแยกเป็นรายการอาหาร/เครื่องดื่มแต่ละอย่างที่เห็น ประเมินตามขนาดจานและปริมาณที่เห็นจริงในภาพ
คำอธิบายจากผู้ใช้: ${a.text.trim()||'(ไม่มี)'}
ตอบเป็น JSON เท่านั้น ไม่มีข้อความอื่น รูปแบบ:
{"items":[{"name":"ชื่อเมนูภาษาไทย","portion":"ปริมาณที่ประเมิน เช่น 1 จาน (~350 ก.)","kcal":จำนวนเต็ม,"protein":กรัม,"carbs":กรัม,"fat":กรัม}],"note":"ข้อสังเกตสั้นๆ เช่น ความไม่แน่นอนหรือสิ่งที่ซ่อนอยู่ในอาหาร"}
ถ้าไม่ใช่อาหาร ให้ items เป็น [] และบอกใน note`;
  try{
    let r;
    if(SAMPLE){r=await SAMPLE.json(prompt,a.blob?{images:[a.blob]}:{})}
    else{r=await callApi(a)}
    const items=(r&&r.items||[]).map(x=>({name:String(x.name||'อาหาร'),portion:String(x.portion||''),kcal:Math.round(+x.kcal||0),k0:Math.round(+x.kcal||0),p:+x.protein||0,c:+x.carbs||0,f:+x.fat||0}));
    if(!items.length)a.err=(r&&r.note)||'AI ไม่พบอาหารในข้อมูลนี้ ลองรูปที่ชัดขึ้นหรือพิมพ์รายละเอียด';
    else{a.items=items;a.note=r.note||''}
  }catch(e){
    const c=e&&e.code;
    if(USE_API){a.err=({daily_limit:'วันนี้ใช้ AI ครบโควตาแล้ว พรุ่งนี้ลองใหม่ หรือใช้แท็บค้นหาเมนูแทนนะ',quota:'ตอนนี้มีคนใช้ AI เยอะ ลองใหม่อีกสักครู่ หรือใช้แท็บค้นหาเมนูแทน',too_large:'รูปใหญ่เกินไป ลองรูปอื่น',not_configured:'ฟีเจอร์ AI ยังไม่เปิดใช้งาน ใช้แท็บค้นหาเมนูแทนได้เลย'})[c]||('ประเมินไม่สำเร็จ ลองใหม่หรือใช้แท็บค้นหาเมนูแทน (รหัส: '+(c||'network')+(e&&e.info?' · '+e.info:'')+')');a.loading=false;if(ui.sh)renderSheet();return}
    a.err=c==='not_granted'?'ต้องอนุญาตให้ใช้ Claude ก่อนจึงจะประเมินได้ ลองกดใหม่อีกครั้ง':c==='rate_limited'?'ใช้ถี่เกินไป รอสักครู่แล้วลองใหม่':c==='images_unavailable'?'หน้านี้ยังส่งรูปให้ AI ไม่ได้ ลองพิมพ์รายละเอียดอาหารแทน':'ประเมินไม่สำเร็จ ลองใหม่หรือใช้แท็บค้นหาเมนูแทน';
  }
  a.loading=false;if(ui.sh)renderSheet();
}

async function callApi(a){
  let image='',mime='image/jpeg';
  if(a.blob){
    image=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=rej;fr.readAsDataURL(a.blob)});
    mime=a.blob.type||'image/jpeg';
  }
  const resp=await fetch('/api/estimate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:image,mime:mime,text:a.text.trim()})});
  let j={};try{j=await resp.json()}catch(x){}
  if(!resp.ok){const err=new Error('api');err.code=j.error||('http_'+resp.status);err.info=[j.status,j.reason,j.detail].filter(Boolean).join(' · ');throw err}
  return j;
}

function setPath(root,path,val){const ks=path.split('.');let o=root;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val}

  if(el.dataset.model){

    if(el.dataset.after==='aitotal'){const t=$('#aiTot');if(t)t.textContent=fmt(aiTotal())+' kcal';const mc=$('#aiMac');if(mc)mc.innerHTML=aiMacHTML()}
  }
  if(el.id==='qtyIn'&&ui.sh&&ui.sh.sel){const q=Math.max(0.5,parseFloat(el.value)||1);ui.sh.qty=q;pv()}
  if(el.id==='wMin'){ui.w.min=Math.max(1,parseInt(el.value)||1);ui.w.kcal=actKcal(ACTS[ui.w.i][1],ui.w.min);$('#wKcal').value=ui.w.kcal}
  if(el.id==='wKcal')ui.w.kcal=Math.max(0,parseInt(el.value)||0);
});
function pv(){const f=ui.sh.sel,q=ui.sh.qty;$('#pvK').textContent=fmt(f.kcal*q);$('#pvP').textContent=Math.round(f.p*q)+'g';$('#pvCF').textContent=Math.round(f.c*q)+'/'+Math.round(f.f*q)+'g'}
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.live){render();return}
  if(el.id==='cuKeep'&&ui.sh)ui.sh.cu.keep=el.checked;
  if(el.dataset.bind){
    let v=el.value;
    if(el.dataset.num!==undefined){v=parseFloat(v);if(isNaN(v)||v<0){render();return}}
    setPath(S,el.dataset.bind,v);
    if(el.dataset.bind.indexOf('profile.')===0&&S.onboarded)S.profile.set=true;
    if(el.dataset.bind==='profile.weight')upsertWeight(S.profile.weight);
    ui.body=null;
    save();
    const gb=$('#goalBox');if(gb)gb.innerHTML=goalBox();
    const sb=$('#stats');if(sb)sb.innerHTML=statsBox();
    if(S.onboarded&&(el.dataset.bind==='profile.name'||el.dataset.bind==='goal.stepGoal'||el.dataset.bind==='goal.period'))render();
  }
});
function upsertWeight(w){const d=todayKey(),x=S.weights.find(r=>r.d===d);if(x)x.w=w;else S.weights.push({d:d,w:w})}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='sheetWrap')closeSheet();return}
  const a=el.dataset.act,v=el.dataset.v,sh=ui.sh;
  switch(a){
    case 'tab':ui.tab=v;ui.confirmReset=false;ui.body=null;render();window.scrollTo(0,0);break;
    case 'day':{const n=addDays(ui.date,+v);if(n<=todayKey()){ui.date=n;render()}break}
    case 'add':openAdd(el.dataset.meal,el.dataset.ask==='1');break;
    case 'pickMeal':sh.meal=v;sh.step='choose';renderSheet();break;
    case 'quick':{const f=foodPool().find(x=>x.name===el.dataset.n);if(f){pushMeal({name:f.name,serving:f.serving,qty:1,kcal:f.kcal,p:f.p,c:f.c,f:f.f},defaultMeal());noteRecent(f.name);save();render();toast('+ '+f.name+' '+fmt(f.kcal)+' kcal')}break}
    case 'pickMode':{sh.step='main';if(v==='photo'){sh.tab='ai';renderSheet();$('#photoCam').click();break}sh.tab=v;renderSheet();break}
    case 'quickCam':{openAdd(defaultMeal());ui.sh.tab='ai';renderSheet();$('#photoCam').click();break}
    case 'coachGo':{const mins=+el.dataset.mins||30;ui.tab='work';ui.w={i:1,min:mins,kcal:actKcal(ACTS[1][1],mins)};ui.body=null;render();window.scrollTo(0,0);break}
    case 'poke':{el.classList.remove('poke');void el.offsetWidth;el.classList.add('poke');playAct(['jump','spin','heart','dance','wave'][Math.floor(Math.random()*5)]);const bt=$('.bubble .bt');if(bt){const q=QUIPS[el.dataset.st]||QUIPS.happy;if(!bt.dataset.o)bt.dataset.o=bt.textContent;bt.textContent=q[Math.floor(Math.random()*q.length)];clearTimeout(window._q);window._q=setTimeout(()=>{bt.textContent=bt.dataset.o},2600)}break}
    case 'close':closeSheet();break;
    case 'setMeal':sh.meal=v;renderSheet();break;
    case 'shTab':sh.tab=v;renderSheet();break;
    case 'cat':sh.cat=v;renderSheet();break;
    case 'pickFood':{const f=foodPool().find(x=>x.name===el.dataset.n);if(f){sh.sel=f;sh.qty=1;renderSheet()}break}
    case 'unpick':sh.sel=null;renderSheet();break;
    case 'qty':{sh.qty=Math.max(0.5,r1(sh.qty+(+v)));$('#qtyIn').value=sh.qty;pv();break}
    case 'confirmFood':{const f=sh.sel,q=sh.qty;pushMeal({name:f.name,serving:f.serving,qty:q,kcal:f.kcal*q,p:f.p*q,c:f.c*q,f:f.f*q});noteRecent(f.name);save();closeSheet();render();toast('เพิ่ม '+f.name+' แล้ว');break}
    case 'photoCam':$('#photoCam').click();break;
    case 'photoPick':$('#photoPick').click();break;
    case 'runAI':runAI();break;
    case 'confirmAI':{
      const items=sh.ai.items.filter(x=>+x.kcal>=0&&x.name);
      items.forEach((x,i)=>{
        const fc=x.k0>0?(+x.kcal)/x.k0:1;pushMeal({name:x.name,serving:x.portion,qty:1,kcal:+x.kcal,p:x.p*fc,c:x.c*fc,f:x.f*fc,img:i===0?sh.ai.img:''});
      });
      save();closeSheet();render();toast('เพิ่มจาก AI แล้ว');break}
    case 'confirmCustom':{
      const c=sh.cu;if(!c.name.trim()||!(+c.kcal>=0)||c.kcal===''){toast('ใส่ชื่อและแคลอรี่ก่อนนะ');break}
      const o={name:c.name.trim(),serving:'1 หน่วย',qty:1,kcal:+c.kcal,p:+c.p||0,c:+c.c||0,f:+c.f||0};
      pushMeal(o);
      if(c.keep&&!S.custom.some(x=>x.name===o.name))S.custom.push({name:o.name,serving:'1 หน่วย',kcal:o.kcal,p:o.p,c:o.c,f:o.f});
      noteRecent(o.name);save();closeSheet();render();toast('เพิ่มแล้ว');break}
    case 'delMeal':{const L=ensureLog(ui.date);L.meals=L.meals.filter(m=>m.id!==el.dataset.id);save();render();break}
    case 'delWork':{const L=ensureLog(ui.date);L.workouts=L.workouts.filter(m=>m.id!==el.dataset.id);save();render();break}
    case 'pickAct':ui.w.i=+el.dataset.i;ui.w.kcal=actKcal(ACTS[ui.w.i][1],ui.w.min);render();break;
    case 'addWork':{
      const w=ui.w,L=ensureLog(ui.date);
      if(!(w.min>0)){toast('ใส่จำนวนนาทีก่อนนะ');break}
      L.workouts.push({id:uid(),name:ACTS[w.i][0],ic:ACTS[w.i][2],min:w.min,kcal:w.kcal});save();render();toast('เพิ่ม '+ACTS[w.i][0]+' แล้ว');break}
    case 'saveSteps':{const n=Math.max(0,parseInt($('#stepIn').value)||0);ensureLog(ui.date).steps=n;save();render();toast('บันทึกก้าวเดินแล้ว');break}
    case 'stepAdd':{const L=ensureLog(ui.date);L.steps=(L.steps||0)+(+v);save();render();break}
    case 'period':S.goal.period=v;save();render();break;
    case 'logWeight':{const w=parseFloat($('#wtIn').value);if(!(w>20&&w<300)){toast('ใส่น้ำหนักเป็นกิโลกรัมนะ');break}S.profile.weight=w;S.profile.set=true;upsertWeight(w);save();render();toast('บันทึกน้ำหนักแล้ว');break}
    case 'sex':S.profile.sex=v;if(S.onboarded)S.profile.set=true;save();render();break;
    case 'obNext':{applyBinds();const o=ui.ob;if(!obCheck(o.step))break;o.step++;save();render();break}
    case 'obBack':applyBinds();ui.ob.step=Math.max(0,ui.ob.step-1);render();break;
    case 'obAct':S.profile.act=+v;save();render();break;
    case 'obMode':ui.ob.mode=v;if(v==='keep')S.goal.target=S.profile.weight;else if(S.goal.target>=S.profile.weight)S.goal.target=Math.max(minTarget(),Math.round(S.profile.weight-5));render();break;
    case 'obPreset':S.goal.period='week';S.goal.amount=+v;save();render();break;
    case 'obDone':{S.onboarded=true;S.profile.set=true;upsertWeight(S.profile.weight);ui.tab='today';ui.ob=null;ui.body=null;save();render();window.scrollTo(0,0);break}
    case 'gLogin':{ui.auth.err='';SB.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}}).then(r=>{if(r.error){ui.auth.err='เข้าสู่ระบบด้วย Google ไม่สำเร็จ: '+r.error.message;render()}});break}
    case 'mailSend':{const a=ui.auth;const em=(a.email||'').trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){a.err='ใส่อีเมลให้ถูกต้องนะ';render();break}
      a.email=em;a.busy=true;a.err='';render();
      SB.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}}).then(r=>{a.busy=false;if(r.error)a.err='ส่งอีเมลไม่สำเร็จ: '+r.error.message;else a.sent=true;render()});break}
    case 'mailBack':ui.auth.sent=false;ui.auth.err='';render();break;
    case 'mailVerify':{const a=ui.auth;const tk=(a.code||'').replace(/\s/g,'');if(tk.length<6){a.err='กรอกรหัสจากอีเมลให้ครบ';render();break}
      a.busy=true;a.err='';render();
      SB.auth.verifyOtp({email:a.email,token:tk,type:'email'}).then(r=>{a.busy=false;if(r.error){a.err='รหัสไม่ถูกต้องหรือหมดอายุ';render()}});break}
    case 'guest':GUEST=true;try{localStorage.setItem('kaelpodi.guest','1')}catch(x){}render();break;
    case 'toLogin':GUEST=false;try{localStorage.removeItem('kaelpodi.guest')}catch(x){}ui.auth=null;render();break;
    case 'syncNow':ui.sync='pending';setSyncLbl();pushCloud().then(()=>{toast(ui.sync==='ok'?'ซิงก์แล้ว':'ซิงก์ไม่สำเร็จ')});break;
    case 'logout':{(async()=>{await pushCloud();try{await SB.auth.signOut()}catch(x){}try{localStorage.removeItem(KEY);localStorage.removeItem('kaelpodi.guest')}catch(x){}S=defaults();USER=null;GUEST=false;ui={tab:'today',date:todayKey(),sh:null};render();toast('ออกจากระบบแล้ว')})();break}
    case 'delCloud':
      if(!ui.confirmCloud){ui.confirmCloud=true;render();setTimeout(()=>{if(ui.confirmCloud){ui.confirmCloud=false;if(ui.tab==='me')render()}},4000)}
      else{ui.confirmCloud=false;SB.from('user_data').delete().eq('user_id',USER.id).then(r=>{toast(r.error?'ลบไม่สำเร็จ':'ลบข้อมูลบนคลาวด์แล้ว');render()})}
      break;
    case 'obRestart':S.onboarded=false;ui.ob={step:0};render();break;
    case 'outfit':S.profile.of=+v;save();render();break;
    case 'hs':S.profile.hs=+v;save();render();break;
    case 'setc':S.profile[el.dataset.k]=v;save();render();break;
    case 'gl':S.profile.gl=!S.profile.gl;save();render();break;
    case 'skin':S.profile.skin=+v;save();render();break;
    case 'kit':S.profile.kit=+v;save();render();break;
    case 'saveBody':{const b=ui.body,hh=+b.h,ww=+b.w;if(!(hh>=100&&hh<=230)||!(ww>=20&&ww<=300)){toast('ใส่ส่วนสูง (ซม.) และน้ำหนัก (กก.) ให้ถูกต้องนะ');break}
      S.profile.height=hh;S.profile.weight=ww;S.profile.set=true;upsertWeight(ww);save();ui.body=null;ui.pop=true;render();ui.pop=false;toast('บันทึกแล้ว 💪 อวตารอัปเดตตามรูปร่างปัจจุบัน');break}
    case 'avatar':openAvatar();break;
    case 'avCam':$('#avatarCam').click();break;
    case 'avPick':$('#avatarIn').click();break;
    case 'setEmoji':S.profile.emoji=v;S.profile.avatar='';if(S.onboarded)S.profile.set=true;save();closeSheet();render();break;
    case 'avClear':S.profile.emoji='';S.profile.avatar='';save();closeSheet();render();break;
    case 'beep':openBeep();break;
    case 'beepSend':beepSend(($('#chatIn')||{}).value);break;
    case 'beepSug':beepSend(el.dataset.q);break;
    case 'install':if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.then(()=>{deferredInstall=null;render()})}break;
    case 'export':doExport();break;
    case 'import':$('#importIn').click();break;
    case 'reset':
      if(!ui.confirmReset){ui.confirmReset=true;render();setTimeout(()=>{if(ui.confirmReset){ui.confirmReset=false;if(ui.tab==='me')render()}},4000)}
      else{if(SB&&USER)SB.from('user_data').delete().eq('user_id',USER.id).then(()=>{});try{localStorage.removeItem(KEY)}catch(x){}S=defaults();ui.confirmReset=false;ui.tab='today';render();toast('ลบข้อมูลทั้งหมดแล้ว')}
      break;
  }
});
$('#photoCam').addEventListener('change',e=>{onPhoto(e.target.files[0]);e.target.value=''});
$('#photoPick').addEventListener('change',e=>{onPhoto(e.target.files[0]);e.target.value=''});
$('#avatarIn').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';setAvatarFile(f)});
$('#avatarCam').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';setAvatarFile(f)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chatIn'){e.preventDefault();beepSend(e.target.value)}});
async function doExport(){
  const data=JSON.stringify(S);
  const name='chompy-backup-'+todayKey()+'.json';
  if(HAS_DL){try{await HAS_DL.save({filename:name,data:data});toast('สำรองข้อมูลแล้ว');return}catch(e){if(e&&e.code==='cancelled')return}}
  try{await navigator.clipboard.writeText(data);toast('คัดลอกข้อมูลสำรองแล้ว วางเก็บไว้ในโน้ตได้เลย')}catch(e){toast('สำรองข้อมูลไม่สำเร็จ ลองเปิดผ่าน Claude')}
}
$('#importIn').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const rd=new FileReader();rd.onload=()=>{try{
    const o=JSON.parse(rd.result);if(!o||!o.profile||!o.logs)throw 0;
    const d=defaults();S={...d,...o,profile:{...d.profile,...o.profile},goal:{...d.goal,...o.goal}};save();render();toast('นำเข้าข้อมูลแล้ว')
  }catch(x){toast('ไฟล์นี้ไม่ใช่ข้อมูลสำรองของแอป')}};rd.readAsText(f);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sh)closeSheet()});
render();
if(AUTH_ON)authInit();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&!window.claude){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
window.addEventListener('pagehide',()=>{if(SB&&USER&&ui.sync==='pending')pushCloud()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&SB&&USER&&ui.sync==='pending')pushCloud()});
})();
</script>

</body>
</html>
